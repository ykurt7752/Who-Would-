function leaderboard(g){return `<div class="scoreboard"><div class="eyebrow">${t('TAHMİN PUANLARI','PREDICTION SCORES')}</div>${[...g.players].sort((a,b)=>(g.scores[b.id]||0)-(g.scores[a.id]||0)).map(p=>`<div class="row spread score-row"><span>${AV[p.avatar]} ${esc(p.name)}</span><strong>${g.scores[p.id]||0} <small>${t('puan','points')}</small></strong></div>`).join('')}</div>`}
function renderResult(g){if(Date.now()<g.revealAt){countdown(g);return}const r=g.result,win=selected(g);let label=win.length>1?t('Beraberlik!','It’s a tie!'):qtitle(g.question);const match=g.duo?(r.match?t('Aynı kişiyi seçtiniz 💛','You chose the same person 💛'):t('Farklı seçimler, güzel bir sohbet!','Different choices, a great conversation!')):'';
 $('app').innerHTML=`<div class="card result reveal-enter"><p class="muted">${esc(qtext(g.question))}</p><div>${win.map(p=>`<span class="avatar">${AV[p.avatar]}</span>`).join(' ')}</div><h2>${win.map(p=>esc(p.name)).join(' + ')}</h2><p>${esc(label)} ✦</p>${match?`<div class="match-pill">${match}</div>`:''}</div><div class="card tally">${g.players.map(p=>`<div class="row spread"><span>${AV[p.avatar]} ${esc(p.name)}</span><strong>${r.tally[p.id]} ${t('oy','votes')}</strong></div><div class="vote-meter"><div style="width:${r.tally[p.id]/g.players.length*100}%"></div></div>`).join('')}${g.prediction?`<p class="muted">${t('Doğru tahminle +1 kazananlar: ','Correct predictions, +1: ')}${g.players.filter(p=>r.earned[p.id]).map(p=>esc(p.name)).join(', ')||t('Bu kez kimse yok.','Nobody this time.')}</p>`:''}<button id="shareResult" class="secondary wide">↗ ${t('Sonuç kartını paylaş','Share result card')}</button></div>${g.prediction?`<div class="card">${leaderboard(g)}</div>`:''}<div class="card defence center"><div class="eyebrow">${t('KENDİNİ SAVUN!','DEFEND YOURSELF!')}</div><h2>${t('Neden sen değilsin?','Why isn’t it you?')}</h2><p>${win.map(p=>esc(p.name)).join(' + ')} — ${t('10 saniye sende. İstersen pas geç!','You have 10 seconds. Feel free to pass!')}</p><div id="defenceClock" class="defence-clock">${g.defendUntil?Math.max(0,Math.ceil((g.defendUntil-Date.now())/1000)):10}</div>${!session||g.host?`<button id="defend" class="secondary wide" ${g.defendUntil?'disabled':''}>${g.defendUntil?t('Süre başlatıldı','Timer started'):t('10 saniyeyi başlat','Start 10 seconds')}</button>`:`<p class="muted">${t('Süreyi oda sahibi başlatabilir.','The host can start the timer.')}</p>`}<p class="muted">${t('Sohbet yüz yüze veya kendi aramanız üzerinden; ses kaydı yok.','Talk in person or on your own call; no audio is recorded.')}</p></div>${!session||g.host?`<button id="next" class="wide">${g.round+1===g.count?t('Tur özetini gör','See round recap'):t('Sonraki soru','Next question')} →</button>`:`<p class="center muted">${t('Oda sahibinin devam etmesi bekleniyor.','Waiting for the host to continue.')}</p>`}`;
 $('shareResult').onclick=()=>shareCard(g.question,g.players,r);if($('defend'))$('defend').onclick=()=>{if(session)action('defend');else{g.defendUntil=Date.now()+10000;beep();render()}};
 if(g.defendUntil>Date.now()){deadline=g.defendUntil;timerType='defence';if($('next'))$('next').disabled=true}
 if($('next'))$('next').onclick=()=>{if(session)action('next');else{g.round++;g.voter=0;g.votes={};g.guesses={};g.defendUntil=0;g.phase=g.round===g.count?'end':'pass';render()}};
 const key=(session?session.code:'local')+'-'+g.round+'-'+g.revealAt;if(renderResult.key!==key){renderResult.key=key;party()}
}
function renderEnd(g,isOnline){const matches=g.history.filter(h=>h.match===true).length;
 $('app').innerHTML=`<div class="eyebrow">${t('NE GÜZEL EKİP!','WHAT A CREW!')}</div><h1>${t('Tur tamamlandı.','That’s a wrap.')}</h1>${g.duo?`<div class="card center"><span class="avatar">💛</span><h2>${matches}/${g.count} ${t('eşleşme','matches')}</h2><p>${t('Aynı kişiyi seçtiğiniz soruların oranı','Share of questions where you chose the same person')}: ${Math.round(matches/g.count*100)}%</p><p class="muted">${t('Bu sadece bu oyunun seçim özeti; ilişkinizi ölçmez.','This is a recap of this game’s choices, not a measure of your relationship.')}</p></div>`:''}${g.prediction?`<div class="card">${leaderboard(g)}</div>`:''}<p>${t('Paylaşmak istediğin sonucu seç. Her kart yalnızca o sorunun sonucunu içerir.','Choose a result to share. Each card contains only that question’s result.')}</p><div class="card">${g.history.map((h,i)=>`<button class="historybutton" data-history="${i}"><span class="muted">${i+1}. ${esc(qtext(h.question))}</span><br><strong>${selected(g,h).map(p=>AV[p.avatar]+' '+esc(p.name)).join(' + ')}</strong> ↗</button>`).join('')}</div>${!isOnline||g.host?`<button id="again" class="wide">${t('Bir tur daha','One more round')} ↻</button>`:`<p class="center muted">${t('Yeni turu oda sahibi başlatabilir.','The host can start another round.')}</p>`}<button id="backHome" class="leave wide">${t('Ana ekran','Home')}</button>`;
 document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{const h=g.history[b.dataset.history];shareCard(h.question,g.players,h)});if($('again'))$('again').onclick=()=>{if(isOnline)action('restart');else{local=null;route('setup','local')}};$('backHome').onclick=home;
}
function renderOnline(){const g=state,app=$('app');
 if(g.phase==='lobby'){
 app.innerHTML=`<div class="eyebrow">${t('OYUN ODASI','GAME ROOM')}</div><h1>${t('Ekibin burada.','Your crew is here.')}</h1><div class="card center"><p class="muted">${t('ODA KODU','ROOM CODE')}</p><div class="code">${g.code}</div><p>${cat(g.category)} · ${theme(g.theme)} · ${g.count} ${t('soru','questions')}</p><div class="chips center-chips"><span class="badge">${g.duo?t('2 kişilik','2-player'):t('3–8 kişilik','3–8 players')}</span><span class="badge pink">${g.prediction?t('Tahminler açık','Predictions on'):t('Klasik oylama','Classic voting')}</span></div>${g.customCount?`<p class="muted">${g.customCount} ${t('özel soru','custom questions')}</p>`:''}<button id="invite" class="secondary wide">↗ ${t('Davet bağlantısını paylaş','Share invite link')}</button></div><div class="card stack">${g.players.map(p=>`<div class="row room-person spread"><span><span class="avatar">${AV[p.avatar]}</span> ${esc(p.name)} ${p.id===g.me?'•':''}</span>${g.host&&p.id!==g.me?`<button data-remove="${p.id}" class="small secondary" aria-label="${t('Oyuncuyu çıkar','Remove player')}">×</button>`:''}</div>`).join('')}<p class="muted">${g.players.length}/${g.duo?2:8} · ${g.duo?t('Başlamak için 2 oyuncu','2 players to start'):t('Başlamak için en az 3 oyuncu','At least 3 players to start')}</p>${g.host?`<button id="begin" ${g.players.length<(g.duo?2:3)?'disabled':''}>${t('Oyunu başlat','Start game')}</button>`:`<p>${t('Oda sahibinin başlatması bekleniyor.','Waiting for the host to start.')}</p>`}</div>`;
 if($('begin'))$('begin').onclick=()=>action('start');$('invite').onclick=invite;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>action('remove',{target:b.dataset.remove}));
 }else if(['predict','vote'].includes(g.phase)){
 const guess=g.phase==='predict',done=guess?g.guessed:g.voted;if(!done){app.innerHTML=choices(g,g.me,guess);bindChoices(id=>action(guess?'guess':'vote',{target:id,round:g.round}))}else{const ids=guess?g.guessers:g.voters;app.innerHTML=`<div class="card center">${progress(g)}<div class="hero"><span class="avatar">${guess?'🔮':'✨'}</span></div><h2>${guess?t('Tahminin kaydedildi!','Prediction recorded!'):t('Oy kaydedildi!','Vote recorded!')}</h2><p>${guess?t('Herkes tahmin yapınca oylama başlayacak.','Voting begins once everyone has predicted.'):t('Herkes oy verince sonuç açılacak.','Results appear once everyone has voted.')}</p><span class="badge">${ids.length}/${g.players.length}</span><div class="waiting-list">${g.players.filter(p=>!ids.includes(p.id)).map(p=>`<p class="muted">${AV[p.avatar]} ${esc(p.name)} …</p>`).join('')}</div></div>`}
 }else if(g.phase==='result')renderResult(g);
 else renderEnd(g,true);
 if(g.phase!=='end'){app.insertAdjacentHTML('beforeend',`<button id="leave" class="leave wide">${t('Oyundan çık','Leave game')}</button>`);$('leave').onclick=home}
}
async function invite(){const u=new URL(location.href);u.search='?room='+state.code;try{if(navigator.share)await navigator.share({title:'Who Would?',text:t('Oyuna katıl! Oda: ','Join us! Room: ')+state.code,url:u.href});else{await navigator.clipboard.writeText(u.href);toast(t('Davet bağlantısı kopyalandı.','Invite link copied.'))}}catch(e){if(e.name!=='AbortError')toast(u.href)}}
async function api(body){const c=new AbortController(),timeout=setTimeout(()=>c.abort(),8000);try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});const d=await r.json();if(!r.ok)throw Error(d.error||'NETWORK');return d}finally{clearTimeout(timeout)}}
function errorText(code){return ({ROOM:t('Oda bulunamadı veya süresi doldu.','Room not found or expired.'),NAME:t('1–24 karakterlik bir isim gir.','Enter a name of 1–24 characters.'),DUPLICATE_NAME:t('Bu isim kullanılıyor. Başka bir isim seç.','That name is taken. Choose another.'),FULL:t('Oda oyuncu sınırına ulaştı.','The room has reached its player limit.'),STARTED:t('Oyun başladı. Sonraki tur için bekle.','The game has started. Wait for the next round.'),SESSION:t('Oturum sona erdi veya odadan çıkarıldın.','Session ended or you were removed.'),MIN:t('Başlamak için yeterli oyuncu yok.','Not enough players to start.'),ROUND:t('Bu aşama sona erdi.','This stage has ended.'),HOST:t('Bu işlemi oda sahibi yapabilir.','Only the host can do that.'),VOTED:t('Oyun zaten kaydedildi.','Your vote is already recorded.'),GUESSED:t('Tahminin zaten kaydedildi.','Your prediction is already recorded.'),CUSTOM:t('Özel sorular 1–180 karakter olmalı.','Custom questions must be 1–180 characters.'),CUSTOM_COUNT:t('Seçtiğin tur için daha fazla özel soru gerekiyor.','More custom questions are needed for this round.'),WAIT:t('Geri sayımın bitmesini bekle.','Wait for the countdown to finish.'),LOBBY_ONLY:t('Oyuncular yalnızca oyun başlamadan çıkarılabilir.','Players can only be removed before the game starts.')})[code]||t('Bağlantı veya işlem hatası. Tekrar dene.','Connection or action error. Try again.')}
async function connect(a){if(busy)return;const e=a==='create'?configError():'';if(e){$('error').textContent=e;return}busy=true;try{const r=await api({action:a,...config(),name:draft.name,avatar:draft.avatar,code:draft.code.trim().toUpperCase()});session={code:r.state.code,token:r.token};state=r.state;persist();render()}catch(e){$('error').textContent=errorText(e.message)}finally{busy=false}}
async function action(a,extra={}){if(busy)return;busy=true;try{const r=await api({action:a,...session,...extra});state=r.state;render()}catch(e){toast(errorText(e.message));render()}finally{busy=false}}
setInterval(async()=>{if(!session||!state||busy||polling)return;polling=true;try{const r=await api({action:'state',...session});if(!busy&&JSON.stringify(r.state)!==signature){state=r.state;render()}}catch(e){if(['ROOM','SESSION'].includes(e.message)){session=null;state=null;persist();screen='onlineSetup';render();toast(errorText(e.message))}else{if(Date.now()-(api.lastWarning||0)>10000){api.lastWarning=Date.now();toast(t('Bağlantı bekleniyor; yeniden deneniyor.','Waiting for connection; retrying.'))}}}finally{polling=false}},1200);
setInterval(()=>{if(!deadline)return;const n=Math.max(0,Math.ceil((deadline-Date.now())/1000));const el=$(timerType==='reveal'?'clock':'defenceClock');if(el&&el.textContent!==String(n)){el.textContent=n;if(n>0)beep(timerType==='reveal'?400+n*100:350,.07)}if(n===0){const type=timerType;deadline=0;timerType='';if(type==='reveal')render();else{if($('next'))$('next').disabled=false;beep(780,.22);toast(t('Süre doldu!','Time’s up!'))}}},150);
function openCustom(){renderCustom();$('customDialog').showModal()}
function renderCustom(){ $('customContent').innerHTML=`<h2>${t('Soruyu sen yaz.','Your question. Your crew.')}</h2><p class="muted">${t('Komik, yaratıcı ve kimseyi küçük düşürmeyen sorular yaz. En fazla 20 soru; her biri 180 karakter.','Write playful, creative questions that don’t put anyone down. Up to 20 questions, 180 characters each.')}</p><label>${t('Türkçe soru (en az bir dil gir)','Turkish question (enter at least one language)')}</label><input id="customTr" maxlength="180" placeholder="${t('Uzayda bir kafe açsa menüyü kim hazırlar?','Who would design a menu for a café in space?')}"><label>${t('İngilizce soru (isteğe bağlı)','English question (optional)')}</label><input id="customEn" maxlength="180"><p class="muted">${t('Çeviri eklemezsen iki dilde de yazdığın metin gösterilir. Sorular bu cihazda sonraki oyunlar için saklanır.','Without a translation, the original text appears in both languages. Questions are saved on this device for future games.')}</p><p id="customError" class="error" role="alert"></p><button id="addCustom" class="wide" ${draft.custom.length>=20?'disabled':''}>＋ ${t('Soruyu ekle','Add question')}</button><div class="custom-list">${draft.custom.map((q,i)=>`<div class="row spread"><p>${esc(q[lang]||q.tr||q.en)}</p><button class="small secondary" data-custom-remove="${i}" aria-label="${t('Soruyu kaldır','Remove question')}">×</button></div>`).join('')}</div><button id="customClose" class="secondary wide">${t('Tamam','Done')} (${draft.custom.length}/20)</button>`;
 $('addCustom').onclick=()=>{const tr=$('customTr').value.trim(),en=$('customEn').value.trim();if(!tr&&!en){$('customError').textContent=t('En az bir dilde soru yaz.','Write a question in at least one language.');return}if(draft.custom.length>=20)return;draft.custom.push({tr,en});saveCustom();renderCustom()};document.querySelectorAll('[data-custom-remove]').forEach(b=>b.onclick=()=>{draft.custom.splice(b.dataset.customRemove,1);if(!draft.custom.length)draft.customOnly=false;saveCustom();renderCustom()});$('customClose').onclick=()=>{$('customDialog').close();render()};
}
function wrapLines(ctx,text,max){const lines=[];let row='';for(const original of String(text).split(/\s+/)){let word=original;while(ctx.measureText(word).width>max){let cut=word.length-1;while(cut>1&&ctx.measureText(word.slice(0,cut)).width>max)cut--;if(row){lines.push(row);row=''}lines.push(word.slice(0,cut));word=word.slice(cut)}const next=row?row+' '+word:word;if(ctx.measureText(next).width>max){lines.push(row);row=word}else row=next}if(row)lines.push(row);return lines}
async function shareCard(q,players,r){const canvas=$('shareCanvas'),ctx=canvas.getContext('2d'),win=players.filter(p=>r.winners.includes(p.id));const g=ctx.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#7053ee');g.addColorStop(1,'#e78abb');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);ctx.textAlign='center';ctx.fillStyle='#ffda87';ctx.font='100px system-ui';ctx.fillText('✦',100,140);ctx.fillStyle='white';ctx.font='bold 55px system-ui';ctx.fillText('Who Would?',540,180);ctx.font='35px system-ui';const qlines=wrapLines(ctx,qtext(q),880);qlines.forEach((line,i)=>ctx.fillText(line,540,290+i*49));let y=340+qlines.length*49;ctx.font=(win.length>4?'65px':'90px')+' system-ui';ctx.fillText(win.map(p=>AV[p.avatar]).join(' '),540,y+50);y+=145;let size=win.length>3?32:52,nlines=[];do{ctx.font='bold '+size+'px system-ui';nlines=wrapLines(ctx,win.map(p=>p.name).join(' + '),900);if(nlines.length*size*1.3<=1040-y)break;size-=2}while(size>22);nlines.forEach((line,i)=>ctx.fillText(line,540,y+i*size*1.3));y+=nlines.length*size*1.3+55;ctx.font='34px system-ui';const tt=win.length>1?t('Beraberlik!','It’s a tie!'):qtitle(q);wrapLines(ctx,tt,900).forEach((line,i)=>ctx.fillText(line,540,y+i*44));ctx.font='32px system-ui';ctx.fillText(`${Math.max(...Object.values(r.tally))}/${players.length} ${t('oy','votes')}`,540,1140);if(r.match!==null&&r.match!==undefined){ctx.font='28px system-ui';ctx.fillText(r.match?t('Aynı kişiyi seçtik 💛','We chose the same person 💛'):t('Farklı seçimler, güzel sohbetler','Different choices, great conversations'),540,1195)}ctx.font='26px system-ui';ctx.fillText(t('Bir soru. Bolca gülümseme.','One question. Plenty of smiles.'),540,1270);shareBlob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!shareBlob){toast(t('Kart oluşturulamadı.','Could not create the card.'));return}$('saveCard').textContent=t('Kartı indir','Download card');$('sendCard').textContent=t('Paylaş','Share');$('closeCard').textContent=t('Kapat','Close');$('shareDialog').showModal()}
$('saveCard').onclick=()=>{if(!shareBlob)return;const u=URL.createObjectURL(shareBlob),a=document.createElement('a');a.href=u;a.download='who-would-result.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('sendCard').onclick=async()=>{if(!shareBlob)return;const file=new File([shareBlob],'who-would-result.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Who Would?'});else{$('saveCard').click();toast(t('Kart indirildi; istediğin uygulamada paylaşabilirsin.','Card downloaded; share it in your favourite app.'))}}catch(e){if(e.name!=='AbortError')toast(t('Paylaşım açılamadı. Kartı indirebilirsin.','Sharing unavailable. You can download the card.'))}};
$('closeCard').onclick=()=>$('shareDialog').close();$('customDialog').addEventListener('cancel',()=>setTimeout(render,0));$('language').onclick=()=>{if($('shareDialog').open)$('shareDialog').close();if($('customDialog').open)$('customDialog').close();lang=lang==='tr'?'en':'tr';try{localStorage.setItem('ww-language',lang)}catch{}render()};$('sound').onclick=()=>{sound=!sound;try{localStorage.setItem('ww-sound',String(sound))}catch{}unlock();beep();$('sound').textContent=sound?'🔊':'🔇';$('sound').setAttribute('aria-pressed',String(sound));$('sound').setAttribute('aria-label',sound?t('Sesi kapat','Turn sound off'):t('Sesi aç','Turn sound on'))};
render();
(async()=>{try{const r=await fetch('/api/health',{signal:AbortSignal.timeout(3000)});const h=await r.json();online=r.ok&&h.ok&&h.version===2;serverOld=!!h.ok&&h.version!==2}catch{}if(online&&session){try{state=(await api({action:'state',...session})).state}catch{session=null;persist()}}else if(session){session=null;persist()}const code=new URLSearchParams(location.search).get('room');if(code&&!session){draft.code=code;screen='onlineSetup'}render()})();

</script></body></html>
