  $('localMode').onclick=()=>{mode='local';screen='setup';render()};$('onlineMode').onclick=()=>{mode='online';screen='onlineSetup';render()};
 }else if(screen==='setup'){
  app.innerHTML=`<h1>${t('Ekibini topla.','Gather your crew.')}</h1><p class="muted">${t('3–8 oyuncu ekle. Herkes kendi avatarını seçsin.','Add 3–8 players and choose your avatars.')}</p><div class="card"><div id="playerInputs" class="stack"></div><button id="addPlayer" class="secondary wide">＋ ${t('Oyuncu ekle','Add player')}</button>${options()}<p id="error" class="error" role="alert"></p><button id="start" class="wide">${t('Oyunu başlat','Let’s play')} →</button></div><button class="leave" id="back">← ${t('Geri','Back')}</button>`;
  let number=0;function add(){const row=document.createElement('div');row.className='row';row.innerHTML=`<select aria-label="${t('Avatar','Avatar')}" style="width:80px">${AV.map((a,i)=>`<option value="${i}" ${i===number%12?'selected':''}>${a}</option>`).join('')}</select><input aria-label="${t('Oyuncu adı','Player name')}" maxlength="24" placeholder="${t('Oyuncu','Player')} ${++number}"><button class="small secondary" aria-label="${t('Oyuncuyu kaldır','Remove player')}">×</button>`;row.querySelector('button').onclick=()=>{row.remove();$('addPlayer').disabled=false};$('playerInputs').append(row);$('addPlayer').disabled=$('playerInputs').children.length>=8;}
  for(let i=0;i<3;i++)add();$('addPlayer').onclick=add;wireOptions();$('back').onclick=home;
  $('start').onclick=()=>{const players=[...$('playerInputs').children].map((r,i)=>({id:String(i),name:r.querySelector('input').value.trim(),avatar:Number(r.querySelector('select').value)}));if(players.length<3||players.length>8||players.some(p=>!p.name)||new Set(players.map(p=>p.name.toLowerCase())).size!==players.length){$('error').textContent=t('3–8 farklı oyuncu adı gir.','Enter 3–8 different player names.');return;}const cat=$('category').value,count=Number($('count').value);local={players,count,category:cat,deck:shuffle(QUESTIONS.filter(q=>q.category===cat)).slice(0,count),round:0,voter:0,votes:{},history:[],phase:'pass'};screen='play';render()};
 }else if(screen==='onlineSetup'){
  app.innerHTML=`<h1>${t('Aynı oda.<br>Ayrı telefonlar.','One room.<br>Your own phones.')}</h1>${!online?`<div class="notice">${t('Çevrim içi sunucuya bağlantı yok. Oda modu için bu oyun sunucusunda açılmalı. Şimdilik tek telefon modunu oynayabilirsin.','No connection to the game server. Open this game on its server to use rooms. You can play one-phone mode now.')}</div>`:''}<div class="card">${identity()}${options()}<p class="error" id="error" role="alert"></p><button class="wide" id="create" ${online?'':'disabled'}>${t('Yeni oda oluştur','Create a room')}</button><label>${t('Veya oda koduyla katıl','Or join with a room code')}</label><input id="roomCode" maxlength="6" style="text-transform:uppercase" value="${esc(new URLSearchParams(location.search).get('room')||'')}" placeholder="A1B2C3"><button id="join" class="wide secondary" ${online?'':'disabled'}>${t('Odaya katıl','Join room')}</button></div><button id="back" class="leave">← ${t('Geri','Back')}</button>`;wireOptions();$('back').onclick=home;
  async function connect(action){if(busy)return;busy=true;try{const r=await api({action,name:$('name').value,avatar:Number($('avatar').value),category:$('category').value,count:Number($('count').value),code:$('roomCode').value.trim().toUpperCase()});session={code:r.state.code,token:r.token};state=r.state;persist();render()}catch(e){$('error').textContent=errorText(e.message)}finally{busy=false}}
  $('create').onclick=()=>connect('create');$('join').onclick=()=>connect('join');
 }else if(local){renderLocal();}
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){if(session&&!confirm(t('Odadan ayrılmak istiyor musun? Bu cihazın oda oturumu silinecek.','Leave the room? This device’s room session will be cleared.')))return;session=null;state=null;persist();screen='home';local=null;render()}
function progress(round,count){return `<div class="row" style="justify-content:space-between"><span class="badge">${category(local?.category||state.category)}</span><span class="muted">${Math.min(round+1,count)} / ${count}</span></div><div class="bar" style="margin-top:16px"><div style="width:${Math.min(round+1,count)/count*100}%"></div></div>`}
function voteView(q,players,who){return `<div class="card">${progress(local?.round??state.round,local?.count??state.count)}<h2>${esc(qt(q))}</h2><p class="muted">${esc(who)}</p><div class="people">${players.map(p=>`<button class="person" data-vote="${p.id}"><span class="avatar">${AV[p.avatar]}</span>${esc(p.name)}</button>`).join('')}</div></div>`}
function winners(players,tally){const max=Math.max(...Object.values(tally));return players.filter(p=>tally[p.id]===max)}
function resultView(q,players,tally){const win=winners(players,tally);return `<div class="card result"><p class="muted">${esc(qt(q))}</p><div>${win.map(p=>`<span class="avatar">${AV[p.avatar]}</span>`).join(' ')}</div><h2>${win.map(p=>esc(p.name)).join(' + ')}</h2><p>${win.length>1?t('Beraberlik!','It’s a tie!'):esc(title(q))} ✦</p></div><div class="card tally">${players.map(p=>`<div class="row"><span><span class="avatar">${AV[p.avatar]}</span> ${esc(p.name)}</span><strong>${tally[p.id]} ${t('oy','votes')}</strong></div>`).join('')}<button id="shareResult" class="wide secondary">↗ ${t('Bu sonucu paylaş','Share this result')}</button></div>`}
function renderLocal(){const l=local,q=l.deck[l.round],app=$('app');if(l.phase==='pass'){app.innerHTML=`<div class="card center">${progress(l.round,l.count)}<div class="hero"><span class="avatar">${AV[l.players[l.voter].avatar]}</span></div><h2>${esc(l.players[l.voter].name)}</h2><p>${t('Telefonu bu oyuncuya ver. Hazır olduğunda soruyu açsın.','Pass the phone to this player. Reveal the question when ready.')}</p><button id="ready" class="wide">${t('Hazırım, soruyu göster','Ready, show the question')}</button></div>`;$('ready').onclick=()=>{l.phase='vote';render()}}
 else if(l.phase==='vote'){app.innerHTML=voteView(q,l.players,t('Gizlice bir kişiyi seç.','Choose one person secretly.'));document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{l.votes[l.players[l.voter].id]=b.dataset.vote;l.voter++;if(l.voter<l.players.length)l.phase='pass';else{l.tally=Object.fromEntries(l.players.map(p=>[p.id,0]));Object.values(l.votes).forEach(id=>l.tally[id]++);l.history.push({question:q,tally:{...l.tally}});l.phase='result'}render()})}
 else if(l.phase==='result'){app.innerHTML=resultView(q,l.players,l.tally)+`<button id="next" class="wide">${l.round+1===l.count?t('Tur özetini gör','See round recap'):t('Sonraki soru','Next question')} →</button>`;$('shareResult').onclick=()=>shareCard(q,l.players,l.tally);$('next').onclick=()=>{l.round++;l.voter=0;l.votes={};l.phase=l.round===l.count?'end':'pass';render()}}
 else{renderEnd(l.players,l.history,false)}
 if(l.phase!=='end'){app.insertAdjacentHTML('beforeend',`<button class="leave wide" id="quit">${t('Oyundan çık','Leave game')}</button>`);$('quit').onclick=()=>{if(confirm(t('Bu turdan çıkılsın mı?','Leave this round?')))home()}}
}
function renderEnd(players,history,isOnline){$('app').innerHTML=`<div class="eyebrow">${t('NE GÜZEL EKİP!','WHAT A CREW!')}</div><h1>${t('Tur tamamlandı.','That’s a wrap.')}</h1><p>${t('Paylaşmak istediğin sonucu seç. Her kart yalnızca o sorunun sonucunu içerir.','Choose a result to share. Each card includes only that question’s result.')}</p><div class="card">${history.map((h,i)=>`<button class="historybutton" data-history="${i}"><span class="muted">${i+1}. ${esc(qt(h.question))}</span><br><strong>${winners(players,h.tally).map(p=>AV[p.avatar]+' '+esc(p.name)).join(' + ')}</strong> ↗</button>`).join('')}</div>${!isOnline||state.host?`<button class="wide" id="again">${t('Bir tur daha','One more round')} ↻</button>`:`<p class="center muted">${t('Yeni turu oda sahibi başlatabilir.','The host can start another round.')}</p>`}<button class="wide leave" id="backHome">${t('Ana ekran','Home')}</button>`;document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{const h=history[b.dataset.history];shareCard(h.question,players,h.tally)});if($('again'))$('again').onclick=()=>{if(isOnline)action('restart');else{screen='setup';local=null;render()}};$('backHome').onclick=home;}
function renderOnline(){const s=state,app=$('app');if(s.phase==='lobby'){app.innerHTML=`<h1>${t('Ekibin burada.','Your crew is here.')}</h1><div class="card center"><p class="muted">${t('ODA KODU','ROOM CODE')}</p><div class="code">${s.code}</div><p>${category(s.category)} · ${s.count} ${t('soru','questions')}</p><button id="invite" class="secondary wide">↗ ${t('Davet bağlantısını paylaş','Share invite link')}</button></div><div class="card stack">${s.players.map(p=>`<div class="row room-person"><span><span class="avatar">${AV[p.avatar]}</span> ${esc(p.name)} ${p.id===s.me?'•':''}</span>${s.host&&p.id!==s.me?`<button class="small secondary" data-remove="${p.id}">×</button>`:''}</div>`).join('')}<p class="muted">${s.players.length}/8 · ${t('Başlamak için en az 3 oyuncu.','At least 3 players to start.')}</p>${s.host?`<button id="begin" ${s.players.length<3?'disabled':''}>${t('Oyunu başlat','Start game')}</button>`:`<p>${t('Oda sahibinin başlatması bekleniyor.','Waiting for the host to start.')}</p>`}</div>`;if($('begin'))$('begin').onclick=()=>action('start');$('invite').onclick=async()=>{const u=new URL(location.href);u.search='?room='+s.code;try{if(navigator.share)await navigator.share({title:'Who Would?',text:t('Oyuna katıl! Oda: ','Join us! Room: ')+s.code,url:u.href});else{await navigator.clipboard.writeText(u.href);toast(t('Davet bağlantısı kopyalandı.','Invite link copied.'))}}catch{toast(u.href)}};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>action('remove',{target:b.dataset.remove}));}
 else if(s.phase==='vote'){if(!s.voted){app.innerHTML=voteView(s.question,s.players,t('Oyun sonunda oyların kimden geldiği gösterilmez.','Individual voters are never revealed.'));document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>action('vote',{target:b.dataset.vote,round:s.round}))}else{app.innerHTML=`<div class="card center">${progress(s.round,s.count)}<div class="hero"><span class="avatar">✨</span></div><h2>${t('Oyun kaydedildi!','Vote recorded!')}</h2><p>${t('Herkes oy verince sonuç açılacak.','Results appear when everyone has voted.')}</p><span class="badge">${s.voters.length}/${s.players.length}</span></div>`}
 if(s.host){app.insertAdjacentHTML('beforeend',`<div class="card"><p class="muted">${t('Oy vermeyen oyuncular','Players still voting')}</p>${s.players.filter(p=>!s.voters.includes(p.id)).map(p=>`<div class="row room-person"><span>${AV[p.avatar]} ${esc(p.name)}</span>${p.id!==s.me?`<button class="small secondary" data-remove="${p.id}">${t('Çıkar','Remove')}</button>`:''}</div>`).join('')}<p class="muted">${t('Çıkarma: en az 3 kişi kalmalı ve oyuncu henüz oy almamış olmalı.','Removal requires at least 3 remaining players and no votes targeting that player.')}</p></div>`);document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm(t('Oyuncu çıkarılsın mı?','Remove this player?')))action('remove',{target:b.dataset.remove})})}}
 else if(s.phase==='result'){app.innerHTML=resultView(s.question,s.players,s.tally)+(s.host?`<button class="wide" id="next">${s.round+1===s.count?t('Tur özetini gör','See round recap'):t('Sonraki soru','Next question')} →</button>`:`<p class="muted center">${t('Oda sahibinin devam etmesi bekleniyor.','Waiting for the host to continue.')}</p>`);$('shareResult').onclick=()=>shareCard(s.question,s.players,s.tally);if($('next'))$('next').onclick=()=>action('next')}
 else renderEnd(s.players,s.history,true);
 if(s.phase!=='end'){app.insertAdjacentHTML('beforeend',`<button id="leave" class="wide leave">${t('Ana ekrana dön','Return home')}</button>`);$('leave').onclick=home}
}
async function api(b){const c=new AbortController(),timeout=setTimeout(()=>c.abort(),8000);try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),signal:c.signal});const d=await r.json();if(!r.ok)throw Error(d.error||'NETWORK');return d}finally{clearTimeout(timeout)}}
function errorText(code){return ({ROOM:t('Oda bulunamadı veya süresi doldu.','Room not found or expired.'),NAME:t('Bir isim gir.','Enter a name.'),DUPLICATE_NAME:t('Bu isim kullanılıyor. Başka bir isim seç.','That name is taken. Choose another.'),FULL:t('Oda dolu: en fazla 8 oyuncu.','Room full: up to 8 players.'),STARTED:t('Oyun başladı. Sonraki tur için bekle.','Game started. Wait for the next round.'),SESSION:t('Oturum sona erdi veya odadan çıkarıldın.','Session ended or you were removed.'),HAS_VOTES:t('Bu oyuncu oy aldığı için tur ortasında çıkarılamaz.','This player has votes and cannot be removed mid-question.'),MIN:t('En az 3 oyuncu gerekir.','At least 3 players are required.'),ROUND:t('Bu soru sona erdi.','This question has ended.'),HOST:t('Bu işlemi oda sahibi yapabilir.','Only the host can do that.'),VOTED:t('Oyun zaten kaydedildi.','Your vote is already recorded.')})[code]||t('Bağlantı veya işlem hatası. Tekrar dene.','Connection or action error. Try again.')}
async function action(a,extra={}){if(busy)return;busy=true;try{const r=await api({action:a,...session,...extra});state=r.state;render()}catch(e){toast(errorText(e.message))}finally{busy=false}}
setInterval(async()=>{if(!session||busy||polling)return;polling=true;try{const r=await api({action:'state',...session});if(JSON.stringify(r.state)!==signature){state=r.state;render()}}catch(e){if(['ROOM','SESSION'].includes(e.message)){session=null;state=null;persist();screen='onlineSetup';render();toast(errorText(e.message))}else toast(t('Bağlantı bekleniyor; yeniden deneniyor.','Waiting for connection; retrying.'))}finally{polling=false}},1500);
async function shareCard(q,players,tally){const canvas=$('shareCanvas'),ctx=canvas.getContext('2d'),win=winners(players,tally);const g=ctx.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#7053ee');g.addColorStop(1,'#b779ed');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);ctx.fillStyle='#ffcf68';ctx.font='100px system-ui';ctx.fillText('✦',80,160);ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 55px system-ui';ctx.fillText('Who Would?',540,190);ctx.font='44px system-ui';function wrap(text,y,max=850,line=60){let row='';for(const word of text.split(' ')){if(ctx.measureText(row+word).width>max){ctx.fillText(row.trim(),540,y);y+=line;row=''}row+=word+' '}ctx.fillText(row.trim(),540,y);return y+line}let y=wrap(qt(q),330);ctx.font='85px system-ui';y+=80;ctx.fillText(win.map(p=>AV[p.avatar]).join(' '),540,y);ctx.font=(win.length>3?'bold 32px':'bold 52px')+' system-ui';y=wrap(win.map(p=>p.name).join(' + '),y+95,900,win.length>3?45:60);ctx.font=(win.length>3?'32px':'38px')+' system-ui';y=wrap(win.length>1?t('Beraberlik!','It’s a tie!'):title(q),y+45);ctx.font='30px system-ui';ctx.fillText(`${Math.max(...Object.values(tally))}/${players.length} ${t('oy','votes')}`,540,y+60);ctx.font='28px system-ui';ctx.fillText(t('Bir soru. Bolca gülümseme.','One question. Plenty of smiles.'),540,1240);shareBlob=await new Promise(r=>canvas.toBlob(r,'image/png'));$('saveCard').textContent=t('Kartı indir','Download card');$('sendCard').textContent=t('Paylaş','Share');$('closeCard').textContent=t('Kapat','Close');$('shareDialog').showModal()}
$('saveCard').onclick=()=>{const u=URL.createObjectURL(shareBlob),a=document.createElement('a');a.href=u;a.download='who-would-result.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('sendCard').onclick=async()=>{const file=new File([shareBlob],'who-would-result.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Who Would?'});else{$('saveCard').click();toast(t('Kart indirildi; istediğin uygulamada paylaşabilirsin.','Card downloaded; share it in your favourite app.'))}}catch(e){if(e.name!=='AbortError')toast(t('Paylaşım açılamadı. Kartı indirebilirsin.','Sharing unavailable. You can download the card.'))}};
$('closeCard').onclick=()=>$('shareDialog').close();$('language').onclick=()=>{if($('shareDialog').open)$('shareDialog').close();const saved=[...document.querySelectorAll('#app input,#app select')].map(e=>e.value),rows=$('playerInputs')?.children.length;lang=lang==='tr'?'en':'tr';try{localStorage.setItem('ww-language',lang)}catch{}render();if(rows){while($('playerInputs').children.length<rows)$('addPlayer').click();while($('playerInputs').children.length>rows)$('playerInputs').lastChild.remove()}const fields=[...document.querySelectorAll('#app input,#app select')];if(fields.length===saved.length)fields.forEach((e,i)=>e.value=saved[i]);if($('count'))document.querySelectorAll('[data-count]').forEach(e=>e.classList.toggle('active',e.dataset.count===$('count').value))};
render();
(async()=>{try{const r=await fetch('/api/health',{signal:AbortSignal.timeout(3000)});online=r.ok&&(await r.json()).ok}catch{}if(online&&session){try{state=(await api({action:'state',...session})).state}catch{session=null;persist()}}if(new URLSearchParams(location.search).has('room')&&!session)screen='onlineSetup';render()})();
</script></body></html>
